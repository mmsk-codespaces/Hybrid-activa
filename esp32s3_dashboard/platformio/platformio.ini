; ReynLab Hybrid Activa — ESP32 Dashboard
; PlatformIO project configuration
;
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32]
platform   = espressif32
board      = esp32dev
framework  = arduino

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

monitor_speed  = 115200
upload_speed   = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
